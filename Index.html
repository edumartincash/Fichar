<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Fichaje</title>
  <style>
    :root {
      --primary: #3498db;
      --gray: #bdc3c7;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .date {
      text-align: center;
      margin-bottom: 10px;
      color: #7f8c8d;
    }

    .clock {
      text-align: center;
      font-size: 2.5rem;
      color: var(--primary);
      font-weight: bold;
      margin: 15px 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .buttons button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 5px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      background-color: var(--gray);
    }

    .buttons button.active {
      background-color: var(--primary);
    }

    #active-session {
      margin-bottom: 10px;
      background-color: #fff8e1;
      border-left: 4px solid orange;
      padding: 10px 12px;
      border-radius: 6px;
      min-height: 40px;
      display: flex;
      align-items: center;
      visibility: visible;
    }

    #active-session.hidden {
      visibility: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #ecf0f1;
    }

    table tr:nth-child(odd):not(:first-child) {
      background-color: #f5f8fa;
    }

    table tr:nth-child(even):not(:first-child) {
      background-color: #e9eff2;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .export-btn {
      margin-top: 20px;
      background-color: #2ecc71;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    @media (max-width: 600px) {
      .clock {
        font-size: 2rem;
      }
      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sistema de Fichaje</h1>
    <p class="date" id="date"></p>
    <div class="clock" id="clock">--:--:--</div>
    <div id="active-session" class="hidden">Sesión activa desde: <span id="active-since"></span></div>
    <div class="buttons">
      <button id="check-in">Entrada</button>
      <button id="check-out">Salida</button>
    </div>
    <h2>Registro Diario</h2>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Entrada</th>
          <th>Salida</th>
          <th>Horas</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="records"></tbody>
    </table>
    <button class="export-btn" onclick="exportToCSV()">Exportar a CSV</button>
  </div>
  <script>
    const clock = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    const checkInBtn = document.getElementById("check-in");
    const checkOutBtn = document.getElementById("check-out");
    const recordsEl = document.getElementById("records");
    const activeSessionBox = document.getElementById("active-session");
    const activeSinceEl = document.getElementById("active-since");
    let records = JSON.parse(localStorage.getItem("fichaje_registros") || "[]");
    let checkInTime = null;

    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString("es-ES");
      dateEl.textContent = now.toLocaleDateString("es-ES", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }

    function roundToNearestQuarterHour(date) {
      const ms = 15 * 60 * 1000;
      return new Date(Math.round(date.getTime() / ms) * ms);
    }

    function handleCheckIn() {
      checkInTime = roundToNearestQuarterHour(new Date());
      localStorage.setItem('fichaje_active_session', JSON.stringify({ checkInTime: checkInTime.getTime() }));
      activeSinceEl.textContent = checkInTime.toLocaleTimeString('es-ES');
      activeSessionBox.classList.remove('hidden');
      toggleButtons(true);
    }

    function handleCheckOut() {
      const checkOutTime = roundToNearestQuarterHour(new Date());
      const durationMs = checkOutTime - checkInTime;
      const durationHours = (durationMs / (1000 * 60 * 60)).toFixed(2);

      const newRecord = {
        date: checkInTime.toLocaleDateString('es-ES'),
        checkIn: checkInTime.toLocaleTimeString('es-ES'),
        checkOut: checkOutTime.toLocaleTimeString('es-ES'),
        duration: durationHours,
        timestamp: Date.now()
      };

      records.push(newRecord);
      saveRecords();
      localStorage.removeItem('fichaje_active_session');
      activeSinceEl.textContent = '';
      activeSessionBox.classList.add('hidden');
      toggleButtons(false);
      updateRecordsTable();
    }

    function restoreSessionState() {
      const savedSession = localStorage.getItem('fichaje_active_session');
      if (savedSession) {
        const session = JSON.parse(savedSession);
        checkInTime = new Date(session.checkInTime);
        activeSinceEl.textContent = checkInTime.toLocaleTimeString('es-ES');
        activeSessionBox.classList.remove('hidden');
        toggleButtons(true);
      } else {
        activeSessionBox.classList.add('hidden');
        toggleButtons(false);
      }
    }

    function toggleButtons(sessionActive) {
      checkInBtn.disabled = sessionActive;
      checkOutBtn.disabled = !sessionActive;
      checkInBtn.classList.toggle('active', !sessionActive);
      checkOutBtn.classList.toggle('active', sessionActive);
    }

    function saveRecords() {
      localStorage.setItem("fichaje_registros", JSON.stringify(records));
    }

    function updateRecordsTable() {
      recordsEl.innerHTML = "";
      records.forEach((record, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${record.date}</td>
          <td>${record.checkIn}</td>
          <td>${record.checkOut}</td>
          <td>${record.duration} h</td>
          <td><button class="delete-btn" onclick="deleteRecord(${index})">Eliminar</button></td>
        `;
        recordsEl.appendChild(row);
      });
    }

    function deleteRecord(index) {
      records.splice(index, 1);
      saveRecords();
      updateRecordsTable();
    }

    function exportToCSV() {
      let csv = "Fecha,Entrada,Salida,Horas\n";
      records.forEach(r => {
        csv += `${r.date},${r.checkIn},${r.checkOut},${r.duration}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "registro_fichaje.csv";
      link.click();
    }

    setInterval(updateClock, 1000);
    updateClock();
    restoreSessionState();
    updateRecordsTable();

    checkInBtn.addEventListener("click", handleCheckIn);
    checkOutBtn.addEventListener("click", handleCheckOut);
  </script>
</body>
</html>
